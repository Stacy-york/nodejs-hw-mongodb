tags:
  - Contacts
summary: Get contact by id
operationId: getContactById
description: Retrieve a contact by its ID that belongs to the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '68737f5bd9efb5b95f74487f'
    description: MongoDB ObjectId of the contact
responses:
  '200':
    description: Contact found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 68737f5bd9efb5b95f74487f!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/error.yaml'
